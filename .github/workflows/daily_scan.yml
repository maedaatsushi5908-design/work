name: kenmo デイリースキャン

on:
  # 毎朝7:48 JST (UTC 22:48 = 前日) に自動実行。通知はせず data/ に蓄積してコミットする
  schedule:
    - cron: '48 22 * * 0-4'   # 日〜木 22:48 UTC = 月〜金 7:48 JST
  # 手動実行ボタンも有効化
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: デイリースキャンを実行してデータを保存
        run: python scanner.py --save-data

      - name: データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "kenmo データ蓄積 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase
          git push
