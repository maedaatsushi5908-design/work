<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三斜求積図 自動チェックツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f5f5f5; color: #333; }
  h1 { text-align: center; padding: 24px 0 8px; font-size: 1.4rem; }
  .subtitle { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 24px; }
  .container { max-width: 860px; margin: 0 auto; padding: 0 16px 40px; }

  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }

  .api-row { display: flex; gap: 8px; align-items: center; }
  .api-row label { white-space: nowrap; font-size: 0.9rem; font-weight: bold; }
  .api-row input { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; font-family: monospace; }
  .api-hint { font-size: 0.75rem; color: #888; margin-top: 6px; }

  .drop-zone {
    border: 2px dashed #aaa; border-radius: 8px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: border-color .2s, background .2s;
  }
  .drop-zone:hover, .drop-zone.over { border-color: #4a90e2; background: #f0f6ff; }
  .drop-zone input[type=file] { display: none; }
  .drop-icon { font-size: 2.5rem; margin-bottom: 8px; }
  .drop-text { font-size: 0.95rem; color: #555; }
  .drop-sub { font-size: 0.78rem; color: #999; margin-top: 4px; }
  .file-name { margin-top: 10px; font-size: 0.85rem; color: #4a90e2; font-weight: bold; }

  .options-row { display: flex; align-items: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .options-row label { font-size: 0.85rem; color: #555; }
  .options-row input[type=number] { width: 90px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }

  .btn {
    display: block; width: 100%; padding: 12px;
    background: #4a90e2; color: #fff; border: none; border-radius: 6px;
    font-size: 1rem; font-weight: bold; cursor: pointer; transition: background .2s;
  }
  .btn:hover { background: #357abd; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }

  .spinner { display: none; text-align: center; padding: 24px; }
  .spinner.show { display: block; }
  .spinner-ring {
    width: 40px; height: 40px; border: 4px solid #ddd;
    border-top-color: #4a90e2; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box { background: #fff0f0; border: 1px solid #f5c6cb; border-radius: 6px; padding: 14px; color: #c00; font-size: 0.9rem; margin-top: 12px; display: none; white-space: pre-wrap; }
  .error-box.show { display: block; }

  .summary {
    border-radius: 6px; padding: 14px 18px; margin-bottom: 16px; font-size: 0.95rem;
  }
  .summary.ok { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
  .summary.ng { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
  .summary .big { font-size: 1.3rem; font-weight: bold; margin-bottom: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { background: #f0f0f0; padding: 8px 10px; text-align: center; border: 1px solid #ddd; white-space: nowrap; }
  td { padding: 7px 10px; border: 1px solid #ddd; text-align: right; }
  td.center { text-align: center; }
  tr.ok td { background: #f0fff4; }
  tr.ng td { background: #fff5f5; }
  tr.warn td { background: #fffbf0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.78rem; font-weight: bold; }
  .badge.ok { background: #28a745; color: #fff; }
  .badge.ng { background: #dc3545; color: #fff; }
  .badge.warn { background: #ffc107; color: #333; }
  .total-row td { background: #f8f8f8; font-weight: bold; border-top: 2px solid #999; }

  @media print {
    .no-print { display: none; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<h1>三斜求積図 自動チェックツール</h1>
<p class="subtitle">AIが図面を読み取り、ヘロンの公式で各三角形を自動検証します</p>

<div class="container">

  <div class="card no-print">
    <div class="api-row">
      <label>APIキー：</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." autocomplete="off">
    </div>
    <p class="api-hint">Google AI Studio の APIキーを入力してください（無料）。取得先：aistudio.google.com → 「Get API key」。キーはこのページ内でのみ使用し、Google APIへの直接通信にのみ使われます。</p>
  </div>

  <div class="card no-print">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.webp,.pdf">
      <div class="drop-icon">📄</div>
      <div class="drop-text">ここにファイルをドラッグ＆ドロップ<br>またはクリックして選択</div>
      <div class="drop-sub">PNG / JPG / WEBP / PDF 対応</div>
      <div class="file-name" id="fileName"></div>
    </div>

    <div class="options-row">
      <label>許容誤差：</label>
      <input type="number" id="tolerance" value="0.005" step="0.001" min="0">
      <label>m²</label>
    </div>

    <br>
    <button class="btn" id="analyzeBtn" onclick="analyze()">図面を解析する</button>
  </div>

  <div class="spinner" id="spinner">
    <div class="spinner-ring"></div>
    <div>AIが図面を読み取り中…（数十秒かかる場合があります）</div>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div id="results"></div>
</div>

<script>
let selectedFile = null;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) setFile(fileInput.files[0]);
});

function setFile(f) {
  selectedFile = f;
  document.getElementById('fileName').textContent = '選択済み：' + f.name;
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function mediaType(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const map = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', pdf: 'application/pdf' };
  return map[ext] || file.type;
}

function heron(a, b, c) {
  if (a <= 0 || b <= 0 || c <= 0) return null;
  if (a + b <= c || a + c <= b || b + c <= a) return null;
  const s = (a + b + c) / 2;
  const val = s * (s - a) * (s - b) * (s - c);
  return val >= 0 ? Math.sqrt(val) : null;
}

async function analyze() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const tolerance = parseFloat(document.getElementById('tolerance').value) || 0.005;
  const errorBox = document.getElementById('errorBox');
  errorBox.classList.remove('show');

  if (!apiKey) { showError('APIキーを入力してください。'); return; }
  if (!selectedFile) { showError('図面ファイルを選択してください。'); return; }

  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('spinner').classList.add('show');
  document.getElementById('results').innerHTML = '';

  try {
    const b64 = await toBase64(selectedFile);
    const mime = mediaType(selectedFile);
    const isPdf = mime === 'application/pdf';

    const filePart = { inline_data: { mime_type: mime, data: b64 } };

    const prompt = `あなたは土木工事の三斜求積図を読み取る専門家です。
添付の図面から以下の情報をすべて抽出してください。

抽出ルール：
- 計算表または図中の各三角形について、三辺の寸法（a, b, c）と記載面積（stated_area）を読み取る
- 面積の単位はm²、辺の単位はm
- 三角形の番号（no）は図面記載のものを使用。なければ1から連番
- stated_totalは計算表の合計面積（記載がない場合はnull）

必ず以下のJSON形式のみで回答してください（説明文不要）：
{"triangles":[{"no":1,"a":数値,"b":数値,"c":数値,"stated_area":数値}],"stated_total":数値またはnull}`;

    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [filePart, { text: prompt }] }],
          generationConfig: { maxOutputTokens: 2048, temperature: 0 }
        })
      }
    );

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || 'APIエラー: ' + resp.status);
    }

    const data = await resp.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('AIの応答からJSONを取得できませんでした。\n\n応答:\n' + text);

    renderResults(JSON.parse(jsonMatch[0]), tolerance);

  } catch (e) {
    showError(e.message || String(e));
  } finally {
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('spinner').classList.remove('show');
  }
}

function renderResults(parsed, tolerance) {
  const triangles = parsed.triangles || [];
  const statedTotal = parsed.stated_total != null ? parseFloat(parsed.stated_total) : null;

  let calcTotal = 0;
  let allOk = true;
  const rows = [];

  for (const t of triangles) {
    const a = parseFloat(t.a), b = parseFloat(t.b), c = parseFloat(t.c);
    const stated = parseFloat(t.stated_area);
    const calc = heron(a, b, c);

    if (calc === null) {
      rows.push({ no: t.no, a, b, c, stated, calc: null, diff: null, status: 'warn' });
      allOk = false;
      continue;
    }

    calcTotal += calc;
    const diff = Math.abs(calc - stated);
    const ok = diff <= tolerance;
    if (!ok) allOk = false;
    rows.push({ no: t.no, a, b, c, stated, calc, diff, status: ok ? 'ok' : 'ng' });
  }

  const totalDiff = statedTotal !== null ? Math.abs(calcTotal - statedTotal) : null;
  const totalOk = totalDiff === null || totalDiff <= tolerance;
  const overallOk = allOk && totalOk;

  let html = `<div class="summary ${overallOk ? 'ok' : 'ng'}">
    <div class="big">${overallOk ? '✅ 合格' : '❌ 要確認'}</div>
    <div>計算合計：${calcTotal.toFixed(4)} m²　記載合計：${statedTotal !== null ? statedTotal.toFixed(4) + ' m²' : '－'}${totalDiff !== null ? '　差：' + totalDiff.toFixed(4) + ' m²' : ''}</div>
    <div style="font-size:0.8rem;margin-top:4px;">許容誤差：±${tolerance} m²　／　三角形数：${triangles.length}</div>
  </div>
  <div class="card">
  <table>
    <thead><tr>
      <th>No.</th><th>辺a (m)</th><th>辺b (m)</th><th>辺c (m)</th>
      <th>記載面積 (m²)</th><th>計算面積 (m²)</th><th>差 (m²)</th><th>判定</th>
    </tr></thead><tbody>`;

  for (const r of rows) {
    const lbl = r.status === 'ok' ? '合格' : r.status === 'ng' ? '要確認' : '警告';
    html += `<tr class="${r.status}">
      <td class="center">${r.no}</td>
      <td>${!isNaN(r.a) ? r.a.toFixed(3) : '－'}</td>
      <td>${!isNaN(r.b) ? r.b.toFixed(3) : '－'}</td>
      <td>${!isNaN(r.c) ? r.c.toFixed(3) : '－'}</td>
      <td>${!isNaN(r.stated) ? r.stated.toFixed(4) : '－'}</td>
      <td>${r.calc !== null ? r.calc.toFixed(4) : '計算不可'}</td>
      <td>${r.diff !== null ? r.diff.toFixed(4) : '－'}</td>
      <td class="center"><span class="badge ${r.status}">${lbl}</span></td>
    </tr>`;
  }

  html += `<tr class="total-row">
    <td class="center" colspan="4">合計</td>
    <td>${statedTotal !== null ? statedTotal.toFixed(4) : '－'}</td>
    <td>${calcTotal.toFixed(4)}</td>
    <td>${totalDiff !== null ? totalDiff.toFixed(4) : '－'}</td>
    <td class="center"><span class="badge ${totalOk ? 'ok' : 'ng'}">${totalOk ? '合格' : '要確認'}</span></td>
  </tr></tbody></table></div>`;

  document.getElementById('results').innerHTML = html;
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = 'エラー：' + msg;
  box.classList.add('show');
}
</script>
</body>
</html>
